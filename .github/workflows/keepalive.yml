name: Supabase Keepalive

on:
  schedule:
    # 每 2 天 UTC 03:00（台灣時間 11:00）跑一次
    # Supabase 免費版 7 天沒活動會自動暫停。`/auth/v1/health` 不算
    # 「活動」（實測 2026-05-07 ping 200 OK，5-10 還是被暫停），
    # 所以改打 PostgREST 表查詢 → 一定觸發 Postgres → 真正計入活動
    - cron: '0 3 */2 * *'
  # 手動觸發（測試 / 急救用）
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    strategy:
      # 不要因為一個專案掛掉就停止，讓所有專案都 ping 一遍
      fail-fast: false
      matrix:
        project:
          - name: 'speech-training'
            ref: 'ybxfsmrawdcisylwjger'
            secret_name: 'SUPABASE_KEY_SPEECH'
            ping_table: 'profiles'
          - name: 'smes-inventory'
            ref: 'xcnmmaayrtiklntvhdhc'
            secret_name: 'SUPABASE_KEY_INVENTORY'
            ping_table: 'profiles'
    steps:
      - name: Ping ${{ matrix.project.name }}
        env:
          KEY: ${{ secrets[matrix.project.secret_name] }}
        run: |
          set -e
          if [ -z "$KEY" ]; then
            echo "❌ 缺少 secret: ${{ matrix.project.secret_name }}"
            echo "   請到 Settings → Secrets and variables → Actions 設定"
            exit 1
          fi

          # 打 PostgREST 表查詢（select=id&limit=1）：
          #   - 一定會觸發實際 Postgres SQL，計入「活動」
          #   - RLS 擋了也沒關係，回 200 + 空陣列仍算活動
          #   - /auth/v1/health 不算（實測 200 OK 但 3 天還是被暫停）
          URL="https://${{ matrix.project.ref }}.supabase.co/rest/v1/${{ matrix.project.ping_table }}?select=id&limit=1"
          STATUS=$(curl -sS -o /tmp/body.txt -w "%{http_code}" --max-time 30 \
            -H "apikey: $KEY" \
            -H "Authorization: Bearer $KEY" \
            "$URL" || echo "000")

          echo "📡 ${{ matrix.project.name }} (${{ matrix.project.ref }}) → HTTP $STATUS"

          if [ "$STATUS" != "200" ]; then
            echo "❌ Ping 失敗，回應內容："
            head -c 500 /tmp/body.txt
            exit 1
          fi

          echo "✅ ${{ matrix.project.name }} 已成功 ping，活動已記錄"

  summary:
    runs-on: ubuntu-latest
    needs: ping
    if: always()
    steps:
      - name: Summary
        run: |
          if [ "${{ needs.ping.result }}" = "success" ]; then
            echo "🎉 所有 Supabase 專案 keepalive 成功"
          else
            echo "⚠️ 部分 Supabase 專案 keepalive 失敗，請檢查 ping job log"
          fi
