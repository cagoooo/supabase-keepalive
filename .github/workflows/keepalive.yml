name: Supabase Keepalive

permissions:
  contents: read
  issues: write

on:
  schedule:
    # 每天 UTC 03:00 + UTC 15:00（台灣 11:00 + 23:00）
    # 2026-05-22 改良：原本每 2 天一次（cron '0 3 */2 * *'），但 speech-training
    # 仍在 48hr 內被 Supabase 暫停（DNS 不解析）。推測免費版規則變嚴，
    # 改成每天兩次提高活動密度，並在失敗時自動開 issue 通知。
    - cron: '0 3,15 * * *'
  # 手動觸發（測試 / 急救用）
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    strategy:
      # 不要因為一個專案掛掉就停止，讓所有專案都 ping 一遍
      fail-fast: false
      matrix:
        project:
          - name: 'speech-training'
            ref: 'ybxfsmrawdcisylwjger'
            secret_name: 'SUPABASE_KEY_SPEECH'
            ping_table: 'profiles'
          - name: 'smes-inventory'
            ref: 'xcnmmaayrtiklntvhdhc'
            secret_name: 'SUPABASE_KEY_INVENTORY'
            ping_table: 'profiles'
    steps:
      - name: Ping ${{ matrix.project.name }}
        env:
          KEY: ${{ secrets[matrix.project.secret_name] }}
        run: |
          set -e
          if [ -z "$KEY" ]; then
            echo "❌ 缺少 secret: ${{ matrix.project.secret_name }}"
            echo "   請到 Settings → Secrets and variables → Actions 設定"
            exit 1
          fi

          # 打 PostgREST 表查詢（select=id&limit=1）：
          #   - 一定會觸發實際 Postgres SQL，計入「活動」
          #   - RLS 擋了也沒關係，回 200 + 空陣列仍算活動
          #   - /auth/v1/health 不算（實測 200 OK 但 3 天還是被暫停）
          URL="https://${{ matrix.project.ref }}.supabase.co/rest/v1/${{ matrix.project.ping_table }}?select=id&limit=1"
          STATUS=$(curl -sS -o /tmp/body.txt -w "%{http_code}" --max-time 30 \
            -H "apikey: $KEY" \
            -H "Authorization: Bearer $KEY" \
            "$URL" || echo "000")

          echo "📡 ${{ matrix.project.name }} (${{ matrix.project.ref }}) → HTTP $STATUS"

          if [ "$STATUS" != "200" ]; then
            echo "❌ Ping 失敗，回應內容："
            head -c 500 /tmp/body.txt 2>/dev/null || echo "(curl 失敗，連 body 都沒拿到 — 通常代表 DNS 不解析 = 已被暫停)"
            echo ""
            exit 1
          fi

          echo "✅ ${{ matrix.project.name }} 已成功 ping，活動已記錄"

      - name: Open issue on failure
        if: failure()
        uses: actions/github-script@v7
        env:
          PROJECT_NAME: ${{ matrix.project.name }}
          PROJECT_REF: ${{ matrix.project.ref }}
          SECRET_NAME: ${{ matrix.project.secret_name }}
        with:
          script: |
            const name = process.env.PROJECT_NAME;
            const ref = process.env.PROJECT_REF;
            const secret = process.env.SECRET_NAME;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const title = `🚨 Supabase keepalive 失敗：${name}`;
            const body = [
              `**專案**：${name} (\`${ref}\`)`,
              `**時間 (UTC)**：${new Date().toISOString()}`,
              `**Workflow run**：${runUrl}`,
              ``,
              `## 最可能原因`,
              `1. **專案已被 Supabase 暫停**（curl 解析不到 host = 已暫停）`,
              `   → 去 [Dashboard](https://supabase.com/dashboard/project/${ref}) 按 **Restore**`,
              `2. Secret 失效（API key 被 rotate）`,
              `   → 重新設定 \`${secret}\``,
              `3. Supabase 服務暫時異常`,
              `   → 等等再手動 dispatch workflow 試試`,
              ``,
              `Restore 完後可在 [Actions 頁面](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions) 手動 dispatch 確認連得回來。`,
            ].join('\n');

            // 確保 label 存在
            try {
              await github.rest.issues.getLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: 'keepalive-fail',
              });
            } catch (e) {
              if (e.status === 404) {
                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: 'keepalive-fail',
                  color: 'd73a4a',
                  description: 'Keepalive workflow detected an outage',
                });
              } else { throw e; }
            }

            // 避免洗版：同 title 已有 open issue 就只留言
            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'keepalive-fail',
              per_page: 100,
            });
            const dup = existing.find(i => i.title === title);
            if (dup) {
              console.log(`已有 open issue #${dup.number}，加 comment 而不新建`);
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: dup.number,
                body: `又掛了一次：${runUrl}（${new Date().toISOString()}）`,
              });
              return;
            }
            const { data: created } = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['keepalive-fail'],
            });
            console.log(`已開 issue #${created.number}：${created.html_url}`);

  summary:
    runs-on: ubuntu-latest
    needs: ping
    if: always()
    steps:
      - name: Summary
        run: |
          if [ "${{ needs.ping.result }}" = "success" ]; then
            echo "🎉 所有 Supabase 專案 keepalive 成功"
          else
            echo "⚠️ 部分 Supabase 專案 keepalive 失敗，請檢查 ping job log（已自動開 issue）"
          fi
